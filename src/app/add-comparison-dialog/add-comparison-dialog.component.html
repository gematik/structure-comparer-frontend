<h2 mat-dialog-title>Create a Comparison</h2>

<mat-dialog-content>

  <!-- Source Profile Selection -->
  <div class="source-profiles-container">
    <h3>Source Profiles</h3>
    
    <div *ngFor="let sourceKey of sourceProfileKeys; let i = index; trackBy: trackByIndex" class="source-profile-row">
      <mat-form-field appearance="fill" class="wide source-selector">
        <mat-label>Source-profile {{i + 1}}</mat-label>
        <mat-select [(ngModel)]="sourceProfileKeys[i]">
          <ng-container *ngFor="let group of packageGroups">
            <!-- Klickbare Gruppe -->
            <div
              class="group-toggle"
              (click)="toggleGroup(group.package)"
              role="option"
              tabindex="0"
            >
              <strong>
                {{ group.package }}
                {{ isGroupCollapsed(group.package) ? '▸' : '▾' }}
              </strong>
            </div>

            <!-- Profile nur anzeigen, wenn Gruppe geöffnet -->
            <ng-container *ngIf="!isGroupCollapsed(group.package)">
              <mat-option
                *ngFor="let profile of group.profiles"
                [value]="profile.key"
              >
                {{ profile.name }}
              </mat-option>
            </ng-container>
          </ng-container>
        </mat-select>
      </mat-form-field>
      
      <div class="button-group">
        <!-- Add button (only show on the last item) -->
        <button 
          *ngIf="i === sourceProfileKeys.length - 1"
          mat-icon-button 
          color="primary" 
          (click)="addSourceProfileSelector()"
          type="button"
          title="Add another source profile"
        >
          <mat-icon>add</mat-icon>
        </button>
        
        <!-- Remove button (only show if more than one selector) -->
        <button 
          *ngIf="sourceProfileKeys.length > 1"
          mat-icon-button 
          color="warn" 
          (click)="removeSourceProfileSelector(i)"
          type="button"
          title="Remove this source profile"
        >
          <mat-icon>remove</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- Target Profile Selection -->
  <mat-form-field appearance="fill" class="wide">
    <mat-label>Target-profile</mat-label>
    <mat-select [(ngModel)]="targetProfileKey">
      <ng-container *ngFor="let group of packageGroups">
        <div
          class="group-toggle"
          (click)="toggleGroup(group.package)"
          role="option"
          tabindex="0"
        >
          <strong>
            {{ group.package }}
            {{ isGroupCollapsed(group.package) ? '▸' : '▾' }}
          </strong>
        </div>

        <ng-container *ngIf="!isGroupCollapsed(group.package)">
          <mat-option
            *ngFor="let profile of group.profiles"
            [value]="profile.key"
          >
            {{ profile.name }}
          </mat-option>
        </ng-container>
      </ng-container>
    </mat-select>
  </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>
