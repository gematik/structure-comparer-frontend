<h2 mat-dialog-title>{{ data.title || 'Bestätigung' }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ data.cancelText || 'Abbrechen' }}</button>
  <button mat-button color="warn" (click)="confirm()">{{ data.confirmText || 'Bestätigen' }}</button>
</mat-dialog-actions>
