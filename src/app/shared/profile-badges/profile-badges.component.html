<ng-container *ngIf="profile; else notAvailable">
  <div
    class="profile-content"
    [matTooltip]="refTooltip || ''"
    matTooltipPosition="above"
  >
    <span *ngIf="profile.must_support" class="badge-ms">S</span>

    <span
      class="badge-cardinality"
      [ngStyle]="getCardinalityStyle(profile.min, profile.max)"
      [matTooltip]="profile.cardinality_note || ''"
      [class.inherited-cardinality]="profile.cardinality_note"
    >
      {{ formatCardinality(profile.min, profile.max) }}
      <span *ngIf="profile.cardinality_note" class="inherited-icon" title="Kardinalität vererbt">↓</span>
    </span>

    <span
      *ngIf="showRefWarning"
      class="ref-warning"
      title="Referenz-Unterschiede vorhanden"
    >
      ❗
    </span>
  </div>
</ng-container>
<ng-template #notAvailable>—</ng-template>
