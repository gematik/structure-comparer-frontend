<h2 mat-dialog-title>Create a Mapping</h2>

<mat-dialog-content>

  <!-- Source Profile Selection -->
  <div class="source-profiles-container">
    <h3>Source Profiles</h3>
    
    <div *ngFor="let sourceKey of sourceProfileKeys; let i = index; trackBy: trackByIndex" class="source-profile-row">
      <app-grouped-select
        class="wide source-selector"
        [label]="'Source-profile ' + (i + 1)"
        [options]="profileOptions"
        [value]="sourceProfileKeys[i]"
        (valueChange)="sourceProfileKeys[i] = $event || ''">
      </app-grouped-select>
      
      <div class="button-group">
        <!-- Remove button (only show if more than one selector) -->
        <button 
          *ngIf="sourceProfileKeys.length > 1"
          mat-icon-button 
          color="warn" 
          (click)="removeSourceProfileSelector(i)"
          type="button"
          title="Remove this source profile"
          class="mat-icon-button-sm"
        >
          <mat-icon>remove</mat-icon>
        </button>
        
        <!-- Invisible spacer when remove button is not shown to maintain alignment -->
        <div *ngIf="sourceProfileKeys.length <= 1" class="button-spacer-small"></div>
        
        <!-- Add button (only show on the last item) -->
        <button 
          *ngIf="i === sourceProfileKeys.length - 1"
          mat-icon-button 
          color="primary" 
          (click)="addSourceProfileSelector()"
          type="button"
          title="Add another source profile"
          class="mat-icon-button-sm"
        >
          <mat-icon>add</mat-icon>
        </button>
        
        <!-- Invisible spacer when add button is not shown to maintain alignment -->
        <div *ngIf="i !== sourceProfileKeys.length - 1" class="button-spacer-small"></div>
      </div>
    </div>
  </div>

  <!-- Target Profile Selection -->
  <div class="selector-container">
    <app-grouped-select
      class="selector-field"
      [label]="'Target-profile'"
      [options]="profileOptions"
      [value]="targetProfileKey"
      (valueChange)="targetProfileKey = $event || ''">
    </app-grouped-select>
    
    <!-- Empty spacer to maintain alignment with source profile rows -->
    <div class="button-spacer"></div>
  </div>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>
