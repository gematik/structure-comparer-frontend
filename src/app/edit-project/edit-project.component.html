<!-- Loading Overlay Component -->
<app-loading-overlay
  [isVisible]="isLoading"
  message="Loading project data..."
>
</app-loading-overlay>

<div class="m-20">
  <h1>Overview for project "{{ projectName }}"</h1>

  <!-- Package List Component -->
  <app-package-list
    [packages]="packages"
    [projectKey]="projectKey"
    (packageDeleted)="onPackageDeleted($event)"
    (packageUpdated)="onPackageUpdated($event)"
  >
  </app-package-list>

  <!-- Comparison List Component -->
  <app-comparison-list
    [comparisons]="comparisons"
    [projectKey]="projectKey"
    (comparisonViewed)="onComparisonViewed($event)"
    (comparisonDeleted)="onComparisonDeleted($event)"
    (comparisonCreated)="onComparisonCreated($event)"
  >
  </app-comparison-list>

  <!-- Mapping List Component -->
  <app-mapping-list
    [mappings]="mappings"
    [projectKey]="projectKey"
    (mappingViewed)="onMappingViewed($event)"
    (mappingDeleted)="onMappingDeleted($event)"
    (mappingCreated)="onMappingCreated($event)"
  >
  </app-mapping-list>

  <!-- Manual Entries Import Section -->
  <div class="manual-entries-import-card mat-elevation-z2">
    <div class="import-card-header">
      <h2>Legacy Data Import</h2>
      <p class="import-description">
        Importieren Sie bestehende manual_entries.yaml Dateien und migrieren Sie diese automatisch
        in das aktuelle Format mit Mapping-Zuordnung.
      </p>
    </div>
    <div class="import-card-actions">
      <button
        mat-raised-button
        color="primary"
        (click)="openManualEntriesImportDialog(projectKey)"
        class="import-button"
      >
        <mat-icon>upload_file</mat-icon>
        Legacy manual_entries.yaml importieren
      </button>
    </div>
  </div>

  <div style="height: 40px"></div>
</div>
