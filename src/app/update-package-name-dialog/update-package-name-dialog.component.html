
<h2 mat-dialog-title>Update package name</h2>

<mat-dialog-content>
  <mat-form-field appearance="fill" class="wide">
    <mat-label>New Package name</mat-label>
    <input matInput [(ngModel)]="packageName" />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>
